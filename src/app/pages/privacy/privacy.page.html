<a class="skip" href="#main">Skip to content</a>
<header class="site-header is-air" app-site-header [onLanding]="false"></header>
<main id="main" tabindex="-1" class="doc">
  <div class="wrap">
    <article class="panel doc-panel">
      <p class="doc-meta">Last updated {{ content.updated }}</p>
      <h1>Privacy policy</h1>
      @for (section of content.sections; track section.heading) {
        <section>
          <h2>{{ section.heading }}</h2>
          <p>{{ section.body }}</p>
        </section>
      }
    </article>
  </div>
</main>
<footer class="site-footer" app-site-footer></footer>
