  <!-- Before first paint, as in the mockup: marks JS as available and applies the saved or system theme. -->
  <script>
    (() => {
      'use strict';
      const root = document.documentElement;
      root.classList.add('js');
      const KEY = 'geohashim-theme';
      let chosen = null;
      try { chosen = localStorage.getItem(KEY); } catch (e) { chosen = null; }
      if (chosen !== 'light' && chosen !== 'dark') chosen = null;
      const darkMQ = matchMedia('(prefers-color-scheme: dark)');
      root.setAttribute('data-theme', chosen || (darkMQ.matches ? 'dark' : 'light'));
    })();
  </script>
